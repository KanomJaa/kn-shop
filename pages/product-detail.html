<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายละเอียดสินค้า - KN Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo"><a href="/index.html"><i class="fa-solid fa-gamepad"></i> <span>KN Shop</span></a></div>
            <ul class="nav-links">
                <li><a href="/index.html"><i class="fa-solid fa-house"></i> หน้าแรก</a></li>
                <li><a href="/pages/topup.html"><i class="fa-solid fa-coins"></i> เติมเงิน</a></li>
                <li><a href="/index.html#categories"><i class="fa-solid fa-store"></i> สินค้า</a></li>
            </ul>
            <div class="auth-buttons"></div>
        </div>
    </nav>
    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <div class="container">
            <ul class="breadcrumb-list">
                <li><a href="/index.html"><i class="fa-solid fa-house"></i> หน้าแรก</a></li>
                <li><span class="breadcrumb-separator"><i class="fa-solid fa-chevron-right"></i></span></li>
                <li><a href="/pages/gamepass.html"><i class="fa-solid fa-folder"></i> หมวดหมู่ทั้งหมด</a></li>
                <li><span class="breadcrumb-separator"><i class="fa-solid fa-chevron-right"></i></span></li>
                <li class="active"><span id="breadcrumbCurrent">รายละเอียดสินค้า</span></li>
            </ul>
        </div>
    </div>

    <div class="container" style="padding: 40px 20px;">
        <div class="product-detail-container">
            <div class="product-detail-image">
                <div id="p-img-container">
                    <div class="placeholder-img large" id="p-img">Loading...</div>
                </div>
                <div id="avg-rating" style="text-align:center; margin-top:15px; font-size:16px;"></div>
            </div>
            <div class="product-detail-info">
                <h1 class="product-title" id="p-title">กำลังโหลดสินค้า...</h1>
                <p class="product-price" id="p-price">฿0</p>
                <div class="product-description">
                    <p><strong>รายละเอียดสินค้า:</strong></p>
                    <ul id="p-desc">
                        <li>กำลังโหลดข้อมูล...</li>
                    </ul>
                </div>
                <div id="stock-status"></div>
                <div class="purchase-form" id="purchaseForm">
                    <div class="form-group">
                        <label>Username Roblox</label>
                        <input type="text" id="robloxUser" placeholder="กรอก Username Roblox ของคุณ">
                        <div id="usernameWarning"
                            style="display:none; color:#c62828; font-size:13px; margin-top:6px; font-weight:500;">
                            <i class="fa-solid fa-exclamation-triangle"></i> กรุณาตั้ง Username Roblox ใน <a
                                href="/pages/profile.html"
                                style="color:#c62828; text-decoration:underline !important; font-weight:700;">โปรไฟล์</a>
                            ก่อนสั่งซื้อ
                        </div>
                    </div>
                    <div class="form-group">
                        <label>จำนวน</label>
                        <input type="number" id="itemQty" value="1" min="1" max="10">
                    </div>
                    <button class="btn-submit" onclick="addToCart()" style="font-size:1.1rem; margin-bottom:10px;">
                        <i class="fa-solid fa-cart-plus"></i> เพิ่มลงตะกร้า
                    </button>
                    <button class="btn-submit" onclick="buyNow()" style="font-size:1.1rem; background:#0277bd;">
                        <i class="fa-solid fa-bolt"></i> ซื้อเลย
                    </button>
                </div>
            </div>
        </div>

        <!-- Reviews Section -->
        <div class="reviews-section" id="reviewsSection">
            <h3 style="margin-bottom:20px;"><i class="fa-solid fa-star"></i> รีวิวจากผู้ซื้อ</h3>
            <div id="reviewFormArea"></div>
            <div id="reviewsList"></div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/pages/product-detail.js"></script>
</body>

</html>
