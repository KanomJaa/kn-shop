<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - KN Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/pages/admin.css">
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo"><a href="/index.html"><i class="fa-solid fa-gamepad"></i> <span>KN Shop</span></a></div>
            <ul class="nav-links">
                <li><a href="/index.html"><i class="fa-solid fa-house"></i> หน้าแรก</a></li>
            </ul>
            <div class="auth-buttons"></div>
        </div>
    </nav>

    <div class="page-header" style="background:linear-gradient(135deg, #1a237e, #3949ab);">
        <div class="container">
            <h1><i class="fa-solid fa-shield-halved"></i> Admin Dashboard</h1>
            <p>ระบบจัดการหลังบ้าน KN Shop</p>
        </div>
    </div>

    <div class="admin-container">
        <div class="admin-stats" id="adminStats"></div>
        <div class="admin-tabs">
            <button class="admin-tab active" onclick="switchTab('orders', this)"><i class="fa-solid fa-box"></i>
                คำสั่งซื้อ</button>
            <button class="admin-tab" onclick="switchTab('topups', this)" id="topupTabBtn"><i
                    class="fa-solid fa-coins"></i>
                เติมเงิน <span id="pendingTopupBadge"
                    style="background:#ef5350; color:white; font-size:11px; padding:2px 7px; border-radius:10px; margin-left:4px; display:none;"></span></button>
            <button class="admin-tab" onclick="switchTab('users', this)"><i class="fa-solid fa-users"></i>
                สมาชิก</button>
            <button class="admin-tab" onclick="switchTab('products', this)"><i class="fa-solid fa-cube"></i>
                สินค้า</button>
            <button class="admin-tab" onclick="switchTab('categories', this)"><i class="fa-solid fa-folder"></i>
                หมวดหมู่</button>
            <button class="admin-tab" onclick="switchTab('banners', this)"><i class="fa-solid fa-images"></i>
                Banner</button>
            <button class="admin-tab" onclick="switchTab('sales', this)"><i class="fa-solid fa-chart-bar"></i>
                ยอดขาย</button>
        </div>
        <div class="admin-panel" id="panel-orders"></div>
        <div class="admin-panel" id="panel-topups" style="display:none;"></div>
        <div class="admin-panel" id="panel-users" style="display:none;"></div>
        <div class="admin-panel" id="panel-products" style="display:none;"></div>
        <div class="admin-panel" id="panel-categories" style="display:none;"></div>
        <div class="admin-panel" id="panel-banners" style="display:none;"></div>
        <div class="admin-panel" id="panel-sales" style="display:none;"></div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box" id="modalContent"></div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/pages/admin/core.js"></script>
    <script src="/js/pages/admin/orders.js"></script>
    <script src="/js/pages/admin/users.js"></script>
    <script src="/js/pages/admin/products.js"></script>
    <script src="/js/pages/admin/categories.js"></script>
    <script src="/js/pages/admin/banners.js"></script>
    <script src="/js/pages/admin/topups.js"></script>
    <script src="/js/pages/admin/sales.js"></script>
</body>

</html>
