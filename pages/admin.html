<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - KN Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 550px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-box h3 {
            margin-bottom: 20px;
        }

        .modal-box .form-group {
            margin-bottom: 15px;
        }

        .modal-box .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 14px;
        }

        .modal-box .form-group input,
        .modal-box .form-group select,
        .modal-box .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .modal-box textarea {
            resize: vertical;
            min-height: 60px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-actions .btn-save {
            background: var(--primary-color);
            color: white;
        }

        .modal-actions .btn-cancel {
            background: #eee;
            color: #333;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .switch .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #ccc;
            border-radius: 24px;
            transition: 0.3s;
        }

        .switch .slider:before {
            content: '';
            position: absolute;
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        .switch input:checked+.slider {
            background: #4caf50;
        }

        .switch input:checked+.slider:before {
            transform: translateX(20px);
        }

        .img-preview {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-bar input,
        .search-bar select {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            flex: 1;
            min-width: 180px;
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(2, 136, 209, 0.1);
        }

        .search-bar .result-count {
            color: #999;
            font-size: 13px;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo"><a href="/index.html"><i class="fa-solid fa-gamepad"></i> <span>KN Shop</span></a></div>
            <ul class="nav-links">
                <li><a href="/index.html"><i class="fa-solid fa-house"></i> หน้าแรก</a></li>
            </ul>
            <div class="auth-buttons"></div>
        </div>
    </nav>

    <div class="page-header" style="background:linear-gradient(135deg, #1a237e, #3949ab);">
        <div class="container">
            <h1><i class="fa-solid fa-shield-halved"></i> Admin Dashboard</h1>
            <p>ระบบจัดการหลังบ้าน KN Shop</p>
        </div>
    </div>

    <div class="admin-container">
        <div class="admin-stats" id="adminStats"></div>
        <div class="admin-tabs">
            <button class="admin-tab active" onclick="switchTab('orders', this)"><i class="fa-solid fa-box"></i>
                คำสั่งซื้อ</button>
            <button class="admin-tab" onclick="switchTab('topups', this)" id="topupTabBtn"><i
                    class="fa-solid fa-coins"></i>
                เติมเงิน <span id="pendingTopupBadge"
                    style="background:#ef5350; color:white; font-size:11px; padding:2px 7px; border-radius:10px; margin-left:4px; display:none;"></span></button>
            <button class="admin-tab" onclick="switchTab('users', this)"><i class="fa-solid fa-users"></i>
                สมาชิก</button>
            <button class="admin-tab" onclick="switchTab('products', this)"><i class="fa-solid fa-cube"></i>
                สินค้า</button>
            <button class="admin-tab" onclick="switchTab('categories', this)"><i class="fa-solid fa-folder"></i>
                หมวดหมู่</button>
            <button class="admin-tab" onclick="switchTab('banners', this)"><i class="fa-solid fa-images"></i>
                Banner</button>
            <button class="admin-tab" onclick="switchTab('sales', this)"><i class="fa-solid fa-chart-bar"></i>
                ยอดขาย</button>
        </div>
        <div class="admin-panel" id="panel-orders"></div>
        <div class="admin-panel" id="panel-topups" style="display:none;"></div>
        <div class="admin-panel" id="panel-users" style="display:none;"></div>
        <div class="admin-panel" id="panel-products" style="display:none;"></div>
        <div class="admin-panel" id="panel-categories" style="display:none;"></div>
        <div class="admin-panel" id="panel-banners" style="display:none;"></div>
        <div class="admin-panel" id="panel-sales" style="display:none;"></div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box" id="modalContent"></div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        let allCategories = [];
        let allBanners = [];

        document.addEventListener('DOMContentLoaded', async () => {
            const user = await KNShop.getCurrentUser();
            if (!user || user.role !== 'admin') { alert('ไม่มีสิทธิ์เข้าถึง'); window.location.href='/index.html'; return; }
            await loadAll();
        });

        async function loadAll() {
            await renderStats();
            await updatePendingBadge();
            const catData = await KNShop.adminGetCategories();
            allCategories = catData.success ? catData.categories : [];
            const bannerData = await KNShop.adminGetBanners();
            allBanners = bannerData.success ? bannerData.banners : [];
            await renderOrders();
            await renderTopups();
            await renderUsers();
            await renderProducts();
            renderCategories();
            renderBanners();
            await renderSales();
        }

        async function updatePendingBadge() {
            const data = await KNShop.adminGetPendingTopupCount();
            const badge = document.getElementById('pendingTopupBadge');
            if (data.success && data.count > 0) {
                badge.textContent = data.count;
                badge.style.display = 'inline';
            } else {
                badge.style.display = 'none';
            }
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            document.querySelectorAll('.admin-panel').forEach(p => p.style.display = 'none');
            document.getElementById('panel-' + tab).style.display = 'block';
        }

        function openModal(html) { document.getElementById('modalContent').innerHTML = html; document.getElementById('modal').classList.add('active'); }
        function closeModal() { document.getElementById('modal').classList.remove('active'); }
        document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

        // ==================== STATS ====================
        async function renderStats() {
            const data = await KNShop.adminGetStats();
            if (!data.success) return;
            const s = data.stats;
            document.getElementById('adminStats').innerHTML = `
                <div class="admin-stat-card"><div class="admin-stat-icon blue"><i class="fa-solid fa-users"></i></div><div class="admin-stat-info"><h4>สมาชิก</h4><p>${s.totalUsers}</p></div></div>
                <div class="admin-stat-card"><div class="admin-stat-icon green"><i class="fa-solid fa-coins"></i></div><div class="admin-stat-info"><h4>รายได้รวม</h4><p>${s.totalRevenue.toLocaleString()} P</p></div></div>
                <div class="admin-stat-card"><div class="admin-stat-icon orange"><i class="fa-solid fa-box"></i></div><div class="admin-stat-info"><h4>ออเดอร์ทั้งหมด</h4><p>${s.totalOrders}</p></div></div>
                <div class="admin-stat-card"><div class="admin-stat-icon purple"><i class="fa-solid fa-clock"></i></div><div class="admin-stat-info"><h4>รอดำเนินการ</h4><p>${s.pendingOrders}</p></div></div>
            `;
        }

        // ==================== ORDERS ====================
        let allOrders = [];
        async function renderOrders() {
            const data = await KNShop.adminGetOrders();
            allOrders = (data.success && data.orders) ? data.orders : [];
            let html = `<div class="search-bar">
                <input type="text" id="searchOrders" placeholder="🔍 ค้นหา Order ID / ชื่อผู้ซื้อ..." oninput="filterOrders()">
                <select id="filterOrderStatus" onchange="filterOrders()">
                    <option value="">สถานะทั้งหมด</option>
                    <option value="pending">⏳ รอดำเนินการ</option>
                    <option value="processing">🔄 กำลังดำเนินการ</option>
                    <option value="completed">✅ สำเร็จ</option>
                    <option value="failed">❌ ผิดพลาด</option>
                    <option value="refunded">↩️ คืนเงินแล้ว</option>
                </select>
                <span class="result-count" id="ordersCount"></span>
            </div>`;
            html += '<div id="ordersTableArea"></div>';
            document.getElementById('panel-orders').innerHTML = html;
            filterOrders();
        }

        function filterOrders() {
            const search = (document.getElementById('searchOrders')?.value || '').toLowerCase();
            const status = document.getElementById('filterOrderStatus')?.value || '';
            let filtered = allOrders.filter(o => {
                if (search && !o.orderId.toLowerCase().includes(search) && !o.username.toLowerCase().includes(search)) return false;
                if (status && o.status !== status) return false;
                return true;
            });
            document.getElementById('ordersCount').textContent = `แสดง ${filtered.length} / ${allOrders.length} รายการ`;
            if (filtered.length === 0) { document.getElementById('ordersTableArea').innerHTML = '<div class="empty-state"><h3>ไม่พบออเดอร์</h3></div>'; return; }
            let html = `<table class="admin-table"><thead><tr><th>Order</th><th>ผู้ซื้อ</th><th>รายการ</th><th>รวม</th><th>สถานะ</th><th>คิว</th><th>จัดการ</th></tr></thead><tbody>`;
            filtered.forEach(o => {
                const items = o.items.map(i => i.title).join(', ');
                html += `<tr>
                    <td style="font-weight:600;">${o.orderId}</td><td>${o.username}</td>
                    <td style="max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${items}">${items}</td>
                    <td style="font-weight:600;">${o.totalPoints.toLocaleString()} P</td>
                    <td><span class="order-status ${KNShop.getStatusClass(o.status)}">${KNShop.getStatusText(o.status)}</span></td>
                    <td>#${o.queueNumber}</td>
                    <td style="white-space:nowrap;">
                        ${o.status === 'pending' ? `<button class="admin-action-btn btn-process" onclick="setOrderStatus('${o.orderId}','processing')">ดำเนินการ</button>` : ''}
                        ${o.status === 'processing' ? `<button class="admin-action-btn btn-approve" onclick="setOrderStatus('${o.orderId}','completed')">สำเร็จ</button><button class="admin-action-btn btn-reject" onclick="setOrderStatus('${o.orderId}','failed')">ผิดพลาด</button>` : ''}
                        ${o.status === 'failed' && !o.refunded ? `<button class="admin-action-btn btn-refund-admin" onclick="refundOrder('${o.orderId}')">คืน Point</button>` : ''}
                    </td></tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('ordersTableArea').innerHTML = html;
        }

        async function setOrderStatus(orderId, status) {
            const r = await KNShop.adminUpdateOrderStatus(orderId, status);
            KNShop.showToast(r.msg); await renderOrders(); await renderStats();
        }
        async function refundOrder(orderId) {
            if (!confirm('ยืนยันคืน Point?')) return;
            const r = await KNShop.adminRefundOrder(orderId);
            KNShop.showToast(r.msg); await renderOrders(); await renderStats();
        }

        // ==================== USERS ====================
        let allUsers = [];
        async function renderUsers() {
            const data = await KNShop.adminGetUsers();
            allUsers = (data.success && data.users) ? data.users : [];
            let html = `<div class="search-bar">
                <input type="text" id="searchUsers" placeholder="🔍 ค้นหาชื่อ / อีเมล..." oninput="filterUsers()">
                <select id="filterUserRole" onchange="filterUsers()">
                    <option value="">สถานะทั้งหมด</option>
                    <option value="admin">🛡️ Admin</option>
                    <option value="member">👤 Member</option>
                    <option value="banned">🚫 Banned</option>
                </select>
                <span class="result-count" id="usersCount"></span>
            </div>`;
            html += '<div id="usersTableArea"></div>';
            document.getElementById('panel-users').innerHTML = html;
            filterUsers();
        }

        function filterUsers() {
            const search = (document.getElementById('searchUsers')?.value || '').toLowerCase();
            const role = document.getElementById('filterUserRole')?.value || '';
            let filtered = allUsers.filter(u => {
                if (search && !u.username.toLowerCase().includes(search) && !u.email.toLowerCase().includes(search)) return false;
                if (role === 'admin' && u.role !== 'admin') return false;
                if (role === 'member' && (u.role === 'admin' || u.isBanned)) return false;
                if (role === 'banned' && !u.isBanned) return false;
                return true;
            });
            document.getElementById('usersCount').textContent = `แสดง ${filtered.length} / ${allUsers.length} คน`;
            if (filtered.length === 0) { document.getElementById('usersTableArea').innerHTML = '<div class="empty-state"><h3>ไม่พบผู้ใช้</h3></div>'; return; }
            let html = `<table class="admin-table"><thead><tr><th>ชื่อ</th><th>อีเมล</th><th>สถานะ</th><th>Point</th><th>วันสมัคร</th><th>จัดการ</th></tr></thead><tbody>`;
            filtered.forEach(u => {
                html += `<tr>
                    <td style="font-weight:600;">${u.username}</td><td>${u.email}</td>
                    <td>${u.role === 'admin' ? '🛡️ Admin' : u.isBanned ? '🚫 Ban' : '👤 Member'}</td>
                    <td style="font-weight:600; color:var(--primary-color);">${u.points.toLocaleString()}</td>
                    <td>${KNShop.formatDate(u.createdAt)}</td>
                    <td style="white-space:nowrap;">
                        <button class="admin-action-btn btn-process" onclick="openPointsModal('${u._id}', '${u.username}', ${u.points})">±Point</button>
                        ${u.role !== 'admin' ? `<button class="admin-action-btn ${u.isBanned ? 'btn-approve' : 'btn-reject'}" onclick="toggleBan('${u._id}', ${!u.isBanned})">${u.isBanned ? 'ปลดแบน' : 'แบน'}</button>` : ''}
                    </td></tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('usersTableArea').innerHTML = html;
        }

        function openPointsModal(userId, username, currentPoints) {
            openModal(`<h3>±Point ให้ ${username}</h3>
                <p style="margin-bottom:15px; color:#777;">Point ปัจจุบัน: ${currentPoints.toLocaleString()}</p>
                <div class="form-group"><label>จำนวน (+ เพิ่ม, - ลด)</label><input type="number" id="ptAmount" placeholder="เช่น 100 หรือ -50"></div>
                <div class="form-group"><label>หมายเหตุ</label><input type="text" id="ptNote" placeholder="เหตุผล (ไม่บังคับ)"></div>
                <div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">ยกเลิก</button><button class="btn-save" onclick="doUpdatePoints('${userId}')">ยืนยัน</button></div>`);
        }

        async function doUpdatePoints(userId) {
            const amount = parseInt(document.getElementById('ptAmount').value);
            const note = document.getElementById('ptNote').value;
            if (!amount) { KNShop.showToast('กรอกจำนวน', 'error'); return; }
            const r = await KNShop.adminUpdatePoints(userId, amount, note);
            KNShop.showToast(r.msg); closeModal(); await renderUsers(); await renderStats();
        }

        async function toggleBan(userId, ban) {
            if (ban && !confirm('ยืนยันแบนผู้ใช้นี้?')) return;
            const r = await KNShop.adminBanUser(userId, ban, ban ? prompt('เหตุผลที่แบน:') || 'ละเมิดกฎ' : '');
            KNShop.showToast(r.msg); await renderUsers();
        }

        // ==================== PRODUCTS ====================
        let allProductsAdmin = [];
        async function renderProducts() {
            const data = await KNShop.adminGetProducts();
            allProductsAdmin = (data.success && data.products) ? data.products : [];
            let html = `<button class="btn-submit" onclick="openProductModal()" style="margin-bottom:20px;"><i class="fa-solid fa-plus"></i> เพิ่มสินค้า</button>`;
            html += `<div class="search-bar">
                <input type="text" id="searchProducts" placeholder="🔍 ค้นหาชื่อสินค้า..." oninput="filterProducts()">
                <select id="filterProductCat" onchange="filterProducts()">
                    <option value="">หมวดทั้งหมด</option>
                    ${allCategories.map(c => `<option value="${c.slug}">${c.name}</option>`).join('')}
                </select>
                <span class="result-count" id="productsCount"></span>
            </div>`;
            html += '<div id="productsTableArea"></div>';
            document.getElementById('panel-products').innerHTML = html;
            filterProducts();
        }

        function filterProducts() {
            const search = (document.getElementById('searchProducts')?.value || '').toLowerCase();
            const cat = document.getElementById('filterProductCat')?.value || '';
            let filtered = allProductsAdmin.filter(p => {
                if (search && !p.title.toLowerCase().includes(search)) return false;
                if (cat && p.categorySlug !== cat) return false;
                return true;
            });
            document.getElementById('productsCount').textContent = `แสดง ${filtered.length} / ${allProductsAdmin.length} รายการ`;
            if (filtered.length === 0) { document.getElementById('productsTableArea').innerHTML = '<div class="empty-state"><h3>ไม่พบสินค้า</h3></div>'; return; }
            let html = `<table class="admin-table"><thead><tr><th>รูป</th><th>ชื่อ</th><th>หมวด</th><th>ราคา</th><th>ขายแล้ว</th><th>สต็อก</th><th>🔥 Hot</th><th>เปิดขาย</th><th>จัดการ</th></tr></thead><tbody>`;
            filtered.forEach(p => {
                html += `<tr>
                    <td>${p.image ? `<img src="${p.image}" class="img-preview">` : `<div style="width:50px;height:50px;background:#f0f0f0;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#999;">${p.imgLabel || '—'}</div>`}</td>
                    <td style="font-weight:600;">${p.title}</td>
                    <td>${p.category?.name || p.categorySlug}</td>
                    <td style="font-weight:600; color:var(--primary-color);">${p.price.toLocaleString()} P</td>
                    <td style="font-weight:600; color:#2e7d32;">${(p.soldCount || 0).toLocaleString()}</td>
                    <td><label class="switch"><input type="checkbox" ${p.inStock ? 'checked' : ''} onchange="toggleField('${p._id}','inStock')"><span class="slider"></span></label><div style="font-size:11px;color:#777;margin-top:2px;">${p.stockQty === -1 ? '∞' : (p.stockQty || 0)}</div></td>
                    <td><label class="switch"><input type="checkbox" ${p.isHot ? 'checked' : ''} onchange="toggleField('${p._id}','isHot')"><span class="slider"></span></label></td>
                    <td><label class="switch"><input type="checkbox" ${p.isActive ? 'checked' : ''} onchange="toggleField('${p._id}','isActive')"><span class="slider"></span></label></td>
                    <td style="white-space:nowrap;">
                        <button class="admin-action-btn btn-process" onclick="openProductModal('${p._id}')">แก้ไข</button>
                        <button class="admin-action-btn btn-reject" onclick="deleteProduct('${p._id}')">ลบ</button>
                    </td></tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('productsTableArea').innerHTML = html;
        }

        function openProductModal(productId) {
            const catOptions = allCategories.map(c => `<option value="${c._id}" data-slug="${c.slug}">${c.name}</option>`).join('');
            openModal(`<h3>${productId ? 'แก้ไข' : 'เพิ่ม'}สินค้า</h3>
                <div class="form-group"><label>ชื่อสินค้า *</label><input type="text" id="pTitle" required></div>
                <div class="form-group"><label>ราคา (Point) *</label><input type="number" id="pPrice" min="0" required></div>
                <div class="form-group"><label>หมวดหมู่ *</label><select id="pCat">${catOptions}</select></div>
                <div class="form-group"><label>รายละเอียด</label><textarea id="pDesc" placeholder="ใช้ • คั่นรายการ"></textarea></div>
                <div class="form-group"><label>ป้ายรูป (Placeholder)</label><input type="text" id="pImgLabel" placeholder="ข้อความบน placeholder"></div>
                <div class="form-group"><label>อัปโหลดรูปสินค้า</label><input type="file" id="pImageFile" accept="image/*"><div id="pImagePreview" style="margin-top:8px;"></div></div>
                <input type="hidden" id="pImageUrl">
                <div class="form-group"><label>จำนวนสต็อก (-1 = ไม่จำกัด)</label><input type="number" id="pStock" value="-1"></div>
                <div class="form-group" style="display:flex;align-items:center;gap:12px;"><label style="margin:0;">🔥 สินค้ายอดฮิต (Hot)</label><label class="switch"><input type="checkbox" id="pIsHot"><span class="slider"></span></label></div>
                <div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">ยกเลิก</button><button class="btn-save" onclick="saveProduct('${productId || ''}')">${productId ? 'บันทึก' : 'เพิ่มสินค้า'}</button></div>`);

            // Image upload handler
            document.getElementById('pImageFile').addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const preview = document.getElementById('pImagePreview');
                preview.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังอัปโหลด...';
                const result = await KNShop.uploadImage(file);
                if (result.success) {
                    document.getElementById('pImageUrl').value = result.imageUrl;
                    preview.innerHTML = `<img src="${result.imageUrl}" class="img-preview"> ✅ อัปโหลดสำเร็จ`;
                } else {
                    preview.innerHTML = '❌ ' + result.msg;
                }
            });

            // If editing, load existing data
            if (productId) loadProductData(productId);
        }

        async function loadProductData(id) {
            const data = await KNShop.getProduct(id);
            if (!data.success) return;
            const p = data.product;
            document.getElementById('pTitle').value = p.title;
            document.getElementById('pPrice').value = p.price;
            document.getElementById('pCat').value = p.category?._id || '';
            document.getElementById('pDesc').value = p.description;
            document.getElementById('pImgLabel').value = p.imgLabel || '';
            document.getElementById('pImageUrl').value = p.image || '';
            document.getElementById('pStock').value = p.stockQty;
            if (p.isHot) document.getElementById('pIsHot').checked = true;
            if (p.image) document.getElementById('pImagePreview').innerHTML = `<img src="${p.image}" class="img-preview">`;
        }

        async function saveProduct(productId) {
            const catSelect = document.getElementById('pCat');
            const selectedOption = catSelect.options[catSelect.selectedIndex];
            const body = {
                title: document.getElementById('pTitle').value,
                price: parseFloat(document.getElementById('pPrice').value),
                categoryId: catSelect.value,
                categorySlug: selectedOption.dataset.slug,
                description: document.getElementById('pDesc').value,
                imgLabel: document.getElementById('pImgLabel').value,
                image: document.getElementById('pImageUrl').value,
                stockQty: parseInt(document.getElementById('pStock').value),
                isHot: document.getElementById('pIsHot').checked
            };
            if (!body.title || !body.price) { KNShop.showToast('กรอกข้อมูลที่จำเป็น', 'error'); return; }

            const r = productId ? await KNShop.adminUpdateProduct(productId, body) : await KNShop.adminCreateProduct(body);
            KNShop.showToast(r.msg); closeModal(); await renderProducts(); await renderStats();
        }

        async function toggleField(id, field) {
            await KNShop.adminToggleProduct(id, field);
        }

        async function deleteProduct(id) {
            if (!confirm('ยืนยันลบสินค้านี้?')) return;
            const r = await KNShop.adminDeleteProduct(id);
            KNShop.showToast(r.msg); await renderProducts();

        // ==================== CATEGORIES ====================
        function renderCategories() {
            let html = `<button class="btn-submit" onclick="openCategoryModal()" style="margin-bottom:20px;"><i class="fa-solid fa-plus"></i> เพิ่มหมวดหมู่</button>`;
            html += `<div class="search-bar">
                <input type="text" id="searchCategories" placeholder="🔍 ค้นหาหมวดหมู่..." oninput="filterCategories()">
                <span class="result-count" id="categoriesCount"></span>
            </div>`;

            document.getElementById('panel-categories').innerHTML = html;
            filterCategories();

        function filterCategories() {
            const search = (document.getElementById('searchCategories')?.value || '').toLowerCase();
            let filtered = allCategories.filter(c => {
                if (search && !c.name.toLowerCase().includes(search) && !c.slug.toLowerCase().includes(search)) return false;
                return true;
            });
            document.getElementById('categoriesCount').textContent = `แสดง ${filtered.length} / ${allCategories.length} หมวด`;
            if (filtered.length === 0) { document.getElementById('categoriesTableArea').innerHTML = '<div class="empty-state"><h3>ไม่พบหมวดหมู่</h3></div>'; return; }
            let html = `<table class="admin-table"><thead><tr><th>รูปภาพ</th><th>ชื่อ</th><th>Slug</th><th>🔥 Hot</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>`;
            filtered.forEach(c => {
                const imgSrc = c.image || '';
                const imgHtml = imgSrc
                    ? `<img src="${imgSrc}" style="width:60px; height:40px; object-fit:cover; border-radius:6px;">`
                    : `<div style="width:60px; height:40px; background:#e3f2fd; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:10px; color:#0288d1;">ไม่มีรูป</div>`;
                html += `<tr>
                    <td>${imgHtml}</td>
                    <td style="font-weight:600;">${c.name}</td><td>${c.slug}</td>
                    <td>
                        <button class="admin-action-btn ${c.isHot ? 'btn-process' : ''}" onclick="toggleCategoryHot('${c._id}', ${!c.isHot})" style="font-size:12px;">
                            ${c.isHot ? '🔥 เปิด' : '⬜ ปิด'}
                        </button>
                    </td>
                    <td>${c.isActive ? '✅ เปิด' : '❌ ปิด'}</td>
                    <td style="white-space:nowrap;">
                        <button class="admin-action-btn btn-process" onclick="openCategoryModal('${c._id}')">แก้ไข</button>
                        <button class="admin-action-btn btn-reject" onclick="deleteCategory('${c._id}')">ลบ</button>
                    </td></tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('categoriesTableArea').innerHTML = html;

        async function toggleCategoryHot(catId, isHot) {
            const r = await KNShop.adminUpdateCategory(catId, { isHot });

        async function saveCategory(catId) {
            // Upload image if selected
            const fileInput = document.getElementById('cImageFile');
            let imageUrl = document.getElementById('cImageUrl').value;

            if (fileInput && fileInput.files.length > 0) {
                const uploadResult = await KNShop.uploadImage(fileInput.files[0]);
                if (uploadResult.success) {
                    imageUrl = uploadResult.imageUrl;
                } else {
                    KNShop.showToast('อัปโหลดรูปล้มเหลว', 'error');
                    return;
                }
            }

            const body = {
                name: document.getElementById('cName').value,
                slug: document.getElementById('cSlug').value,
                description: document.getElementById('cDesc').value,
                image: imageUrl,
                isHot: document.getElementById('cHot').value === 'true',
                isActive: document.getElementById('cActive').value === 'true'
            };
            if (!body.name || !body.slug) { KNShop.showToast('กรอกชื่อและ slug', 'error'); return; }
            const r = catId ? await KNShop.adminUpdateCategory(catId, body) : await KNShop.adminCreateCategory(body);
            KNShop.showToast(r.msg); closeModal();
            const catData = await KNShop.adminGetCategories();
            allCategories = catData.success ? catData.categories : [];
            renderCategories();
        }

        async function deleteCategory(id) {
            if (!confirm('ยืนยันลบหมวดหมู่? (ต้องลบสินค้าในหมวดหมู่ก่อน)')) return;
            const r = await KNShop.adminDeleteCategory(id);
            if (r.success) {
                allCategories = allCategories.filter(c => c._id !== id);
                renderCategories();
            }
            KNShop.showToast(r.msg, r.success ? 'success' : 'error');
        }

        async function saveBanner(bannerId) {

            let imageUrl = document.getElementById('bImageUrl').value;

            if (fileInput.files.length > 0) {

        // ==================== TOPUP MANAGEMENT ====================
        let allTopups = [];
        async function renderTopups() {
            const data = await KNShop.adminGetTopups();
            allTopups = (data.success && data.topups) ? data.topups : [];
            let html = `<div class="search-bar">
                <input type="text" id="searchTopups" placeholder="🔍 ค้นหาชื่อผู้ใช้ / อีเมล..." oninput="filterTopups()">
                <select id="filterTopupStatus" onchange="filterTopups()">
                    <option value="">สถานะทั้งหมด</option>
                    <option value="pending" selected>⏳ รอตรวจสอบ</option>
                    <option value="success">✅ อนุมัติแล้ว</option>
                    <option value="failed">❌ ปฏิเสธ</option>
                </select>
                <span class="result-count" id="topupsCount"></span>
            </div>`;
            html += '<div id="topupsTableArea"></div>';
            document.getElementById('panel-topups').innerHTML = html;
            filterTopups();
        }

        function filterTopups() {
            const search = (document.getElementById('searchTopups')?.value || '').toLowerCase();
            const status = document.getElementById('filterTopupStatus')?.value || '';
            let filtered = allTopups.filter(t => {
                const username = t.user?.username || '';
                const email = t.user?.email || '';
                if (search && !username.toLowerCase().includes(search) && !email.toLowerCase().includes(search)) return false;
                if (status && t.status !== status) return false;
                return true;
            });
            document.getElementById('topupsCount').textContent = `แสดง ${filtered.length} / ${allTopups.length} รายการ`;
            if (filtered.length === 0) {
                document.getElementById('topupsTableArea').innerHTML = '<div class="empty-state"><h3>ไม่พบรายการเติมเงิน</h3></div>';
                return;
            }
            const statusMap = {
                pending: '<span style="color:#e65100; font-weight:600;">⏳ รอตรวจสอบ</span>',
                success: '<span style="color:#2e7d32; font-weight:600;">✅ อนุมัติ</span>',
                failed: '<span style="color:#c62828; font-weight:600;">❌ ปฏิเสธ</span>'
            };
            let html = `<table class="admin-table"><thead><tr><th>ผู้ใช้</th><th>จำนวน</th><th>สลิป</th><th>วิธี</th><th>สถานะ</th><th>วันที่</th><th>หมายเหตุ</th><th>จัดการ</th></tr></thead><tbody>`;
            filtered.forEach(t => {
                const slipHtml = t.slipImage
                    ? `<a href="${t.slipImage}" target="_blank" title="คลิกเพื่อดูสลิปเต็ม"><img src="${t.slipImage}" style="width:50px; height:65px; object-fit:cover; border-radius:6px; border:1px solid #ddd; cursor:pointer; transition:transform 0.2s;" onmouseover="this.style.transform='scale(1.5)'" onmouseout="this.style.transform='scale(1)'"></a>`
                    : '<span style="color:#999; font-size:12px;">ไม่มี</span>';
                html += `<tr style="${t.status === 'pending' ? 'background:#fffde7;' : ''}">
                    <td><div style="font-weight:600;">${t.user?.username || 'N/A'}</div><div style="font-size:11px; color:#999;">${t.user?.email || ''}</div></td>
                    <td style="font-weight:700; color:var(--primary-color); font-size:16px;">${t.amount.toLocaleString()} P</td>
                    <td>${slipHtml}</td>
                    <td>${t.method === 'bank' ? '🏦 โอนธนาคาร' : t.method}</td>
                    <td>${statusMap[t.status] || t.status}</td>
                    <td style="font-size:13px;">${KNShop.formatDate(t.createdAt)}</td>
                    <td style="font-size:12px; max-width:150px; overflow:hidden; text-overflow:ellipsis;" title="${t.note || ''}">${t.note || '-'}</td>
                    <td style="white-space:nowrap;">
                        ${t.status === 'pending' ? `
                            <button class="admin-action-btn btn-approve" onclick="approveTopup('${t._id}', '${t.user?.username || ''}', ${t.amount})">✅ อนุมัติ</button>
                            <button class="admin-action-btn btn-reject" onclick="rejectTopup('${t._id}', '${t.user?.username || ''}', ${t.amount})">❌ ปฏิเสธ</button>
                        ` : ''}
                    </td>
                </tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('topupsTableArea').innerHTML = html;
        }

        async function approveTopup(id, username, amount) {
            if (!confirm(`ยืนยันอนุมัติ ${amount.toLocaleString()} Point ให้ ${username}?`)) return;
            const r = await KNShop.adminApproveTopup(id);
            KNShop.showToast(r.msg, r.success ? 'success' : 'error');
            await renderTopups();
            await renderStats();
            await updatePendingBadge();
        }

        async function rejectTopup(id, username, amount) {
            const reason = prompt(`ปฏิเสธ ${amount.toLocaleString()} Point ของ ${username}\n\nเหตุผล:`, 'ไม่พบหลักฐานการโอน');
            if (reason === null) return; // cancelled
            const r = await KNShop.adminRejectTopup(id, reason);
            KNShop.showToast(r.msg, r.success ? 'success' : 'error');
            await renderTopups();
            await updatePendingBadge();
        }

        // ==================== SALES REPORT ====================
        async function renderSales() {
            const data = await KNShop.adminGetSalesReport(30);
            if (!data.success) return;
            let html = '<h4 style="margin-bottom:15px;">📊 รายงานรายวัน (30 วัน)</h4>';

            if (data.dailySales.length > 0) {
                const maxTotal = Math.max(...data.dailySales.map(d => d.total));
                html += `<table class="admin-table"><thead><tr><th>วันที่</th><th>ออเดอร์</th><th>ยอดขาย</th><th>กราฟ</th></tr></thead><tbody>`;
                data.dailySales.forEach(d => {
                    const w = Math.max(5, (d.total / maxTotal) * 100);
                    html += `<tr><td style="font-weight:600;">${d._id}</td><td>${d.count}</td><td style="font-weight:700; color:var(--primary-color);">${d.total.toLocaleString()} P</td>
                    <td><div style="background:linear-gradient(90deg, #03a9f4, #0288d1); height:20px; width:${w}%; border-radius:10px;"></div></td></tr>`;
                });
                html += '</tbody></table>';
            } else {
                html += '<p style="color:#999; text-align:center;">ยังไม่มีข้อมูล</p>';
            }

            // Monthly
            if (data.monthlySales?.length > 0) {
                html += '<h4 style="margin:30px 0 15px;">📅 รายงานรายเดือน</h4>';
                html += `<table class="admin-table"><thead><tr><th>เดือน</th><th>ออเดอร์</th><th>ยอดขาย</th></tr></thead><tbody>`;
                data.monthlySales.forEach(m => {
                    html += `<tr><td style="font-weight:600;">${m._id}</td><td>${m.count}</td><td style="font-weight:700; color:var(--primary-color);">${m.total.toLocaleString()} P</td></tr>`;
                });
                html += '</tbody></table>';
            }

            // Topup summary
            const tu = data.topupStats;
            html += `<div style="display:flex; justify-content:space-around; margin-top:25px; padding:20px; background:#f8f9fa; border-radius:8px;">
                <div style="text-align:center;"><div style="font-size:24px; font-weight:700;">${tu.count}</div><div style="font-size:13px; color:#777;">เติมเงินทั้งหมด</div></div>
                <div style="text-align:center;"><div style="font-size:24px; font-weight:700; color:var(--primary-color);">${tu.total.toLocaleString()} P</div><div style="font-size:13px; color:#777;">ยอดเติมเงินรวม</div></div>
            </div>`;

            document.getElementById('panel-sales').innerHTML = html;
        }
    </script>
</body>

</html>
