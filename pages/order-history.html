<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติสั่งซื้อ - KN Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo"><a href="/index.html"><i class="fa-solid fa-gamepad"></i> <span>KN Shop</span></a></div>
            <ul class="nav-links">
                <li><a href="/index.html"><i class="fa-solid fa-house"></i> หน้าแรก</a></li>
                <li><a href="/index.html#categories"><i class="fa-solid fa-store"></i> สินค้า</a></li>
            </ul>
            <div class="auth-buttons"></div>
        </div>
    </nav>
    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <div class="container">
            <ul class="breadcrumb-list">
                <li><a href="/index.html"><i class="fa-solid fa-house"></i> หน้าแรก</a></li>
                <li><span class="breadcrumb-separator"><i class="fa-solid fa-chevron-right"></i></span></li>
                <li><a href="/pages/profile.html"><i class="fa-solid fa-folder"></i> โปรไฟล์</a></li>
                <li><span class="breadcrumb-separator"><i class="fa-solid fa-chevron-right"></i></span></li>
                <li class="active"><span>ประวัติสั่งซื้อ</span></li>
            </ul>
        </div>
    </div>
    <div class="page-header">
        <div class="container">
            <h1><i class="fa-solid fa-clock-rotate-left"></i> ประวัติสั่งซื้อ</h1>
        </div>
    </div>
    <div class="orders-container" id="ordersContent">
        <div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i>
            <h3>กำลังโหลด...</h3>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!KNShop.isLoggedIn()) { window.location.href='/pages/login.html'; return; }
            const data = await KNShop.getUserOrders();
            const container = document.getElementById('ordersContent');
            if (!data.success || !data.orders || data.orders.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-box-open"></i><h3>ยังไม่มีคำสั่งซื้อ</h3></div>';
                return;
            }
            container.innerHTML = data.orders.map(order => {
                const itemsHtml = order.items.map(item =>
                    `<div class="order-item-row"><span>${item.title} x${item.qty} ${item.robloxUsername ? '(Roblox: ' + item.robloxUsername + ')' : ''}</span><span style="font-weight:600;">${(item.price * item.qty).toLocaleString()} P</span></div>`
                ).join('');
                return `<div class="order-card">
                    <div class="order-header"><div><span class="order-id">${order.orderId}</span><span class="order-date" style="margin-left:15px;">${KNShop.formatDate(order.createdAt)}</span></div>
                    <span class="order-status ${KNShop.getStatusClass(order.status)}">${KNShop.getStatusText(order.status)}</span></div>
                    <div class="order-items">${itemsHtml}</div>
                    <div class="order-footer"><span class="order-queue">คิวที่ #${order.queueNumber}</span><span class="order-total">${order.totalPoints.toLocaleString()} Point</span></div>
                </div>`;
            }).join('');
        });
    </script>
</body>

</html>
