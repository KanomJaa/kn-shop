<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรไฟล์ - KN Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo"><a href="/index.html"><i class="fa-solid fa-gamepad"></i> <span>KN Shop</span></a></div>
            <ul class="nav-links">
                <li><a href="/index.html"><i class="fa-solid fa-house"></i> หน้าแรก</a></li>
                <li><a href="/index.html#categories"><i class="fa-solid fa-store"></i> สินค้า</a></li>
            </ul>
            <div class="auth-buttons"></div>
        </div>
    </nav>
    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <div class="container">
            <ul class="breadcrumb-list">
                <li><a href="/index.html"><i class="fa-solid fa-house"></i> หน้าแรก</a></li>
                <li><span class="breadcrumb-separator"><i class="fa-solid fa-chevron-right"></i></span></li>
                <li class="active"><span>โปรไฟล์</span></li>
            </ul>
        </div>
    </div>
    <div class="page-header">
        <div class="container">
            <h1><i class="fa-solid fa-user"></i> โปรไฟล์ของฉัน</h1>
        </div>
    </div>

    <div class="profile-container">
        <div class="profile-card">
            <div class="profile-avatar"><i class="fa-solid fa-user"></i></div>
            <h2 id="profileName">Loading...</h2>
            <form onsubmit="saveProfile(event)">
                <div class="form-group"><label>ชื่อผู้ใช้</label><input type="text" id="pUsername" disabled
                        style="background:#f5f5f5;"></div>
                <div class="form-group"><label>อีเมล</label><input type="email" id="pEmail" disabled
                        style="background:#f5f5f5;"></div>
                <div class="form-group"><label>Roblox Username</label><input type="text" id="pRoblox"
                        placeholder="กรอก Roblox Username ของคุณ"></div>
                <div class="form-group"><label>Point คงเหลือ</label><input type="text" id="pPoints" disabled
                        style="background:#e1f5fe; color:#0277bd; font-weight:700;"></div>
                <div class="form-group"><label>สมาชิกตั้งแต่</label><input type="text" id="pCreated" disabled
                        style="background:#f5f5f5;"></div>
                <button type="submit" class="btn-submit"><i class="fa-solid fa-save"></i> บันทึกข้อมูล</button>
            </form>
            <div style="display:flex; gap:10px; margin-top:15px;">
                <a href="/pages/wallet.html" class="btn-submit"
                    style="text-align:center; text-decoration:none; background:#0288d1;"><i
                        class="fa-solid fa-wallet"></i> กระเป๋าเงิน</a>
                <a href="/pages/order-history.html" class="btn-submit"
                    style="text-align:center; text-decoration:none; background:#555;"><i
                        class="fa-solid fa-clock-rotate-left"></i> ประวัติสั่งซื้อ</a>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/pages/profile.js"></script>
</body>

</html>
