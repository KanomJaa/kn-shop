<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สินค้า - KN Shop</title>
    <meta name="description" content="สินค้าเกม Roblox ราคาถูก ส่งไว ปลอดภัย 100% - KN Shop">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .products-loading {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .products-loading i {
            font-size: 2rem;
            margin-bottom: 15px;
            display: block;
            color: var(--primary-color);
        }

        .products-empty {
            text-align: center;
            padding: 60px 20px;
        }

        .products-empty i {
            font-size: 3rem;
            color: #ddd;
            margin-bottom: 10px;
            display: block;
        }

        .filter-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filter-bar .search-input {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
        }

        .filter-bar .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(2, 136, 209, 0.1);
        }

        .filter-bar .sort-select {
            padding: 10px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-family: inherit;
            background: white;
            cursor: pointer;
        }

        .product-count {
            color: #999;
            font-size: 14px;
        }

        /* ==================== REDESIGNED PRODUCT CARDS ==================== */
        .pd-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .pd-card {
            background: linear-gradient(180deg, #e3f2fd 0%, #ffffff 50%);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.06);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            border: 1px solid #e0f0fb;
        }

        .pd-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 30px rgba(2, 136, 209, 0.15);
            border-color: #90caf9;
        }

        .pd-card-image {
            height: 160px;
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .pd-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }

        .pd-card:hover .pd-card-image img {
            transform: scale(1.06);
        }

        .pd-card-label {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            font-weight: 700;
            font-size: 18px;
            color: #0277bd;
            text-align: center;
            padding: 10px;
        }

        .pd-out-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #c62828, #e53935);
            color: white;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            z-index: 5;
        }

        .pd-hot-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: linear-gradient(135deg, #ff5722, #ff9800);
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 3px;
            animation: hotPulse 2s ease-in-out infinite;
        }

        .pd-body {
            padding: 14px 16px 16px;
        }

        .pd-title {
            font-size: 15px;
            font-weight: 700;
            color: #0277bd;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pd-desc {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .pd-price {
            font-size: 22px;
            font-weight: 700;
            color: #2e7d32;
            margin-bottom: 6px;
        }

        .pd-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 12px;
            color: #777;
            margin-bottom: 12px;
        }

        .pd-meta i {
            margin-right: 3px;
        }

        .pd-meta .sold-info i {
            color: #ff9800;
        }

        .pd-meta .stock-info i {
            color: #66bb6a;
        }

        .pd-meta .stock-info.out-of-stock {
            color: #c62828;
        }

        .pd-meta .stock-info.out-of-stock i {
            color: #c62828;
        }

        .pd-btn {
            display: block;
            background: linear-gradient(135deg, #2e7d32, #43a047);
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            text-decoration: none;
            cursor: pointer;
        }

        .pd-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(46, 125, 50, 0.3);
        }

        .pd-btn.disabled {
            background: #bdbdbd;
            cursor: not-allowed;
            pointer-events: none;
        }

        .pd-btn i {
            margin-right: 5px;
        }

        @media (max-width: 768px) {
            .pd-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 12px;
            }

            .pd-card-image {
                height: 120px;
            }

            .pd-body {
                padding: 10px 12px 12px;
            }

            .pd-title {
                font-size: 13px;
            }

            .pd-price {
                font-size: 18px;
            }

            .pd-meta {
                font-size: 11px;
                gap: 6px;
            }

            .pd-btn {
                padding: 8px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo"><a href="/index.html"><i class="fa-solid fa-gamepad"></i> <span>KN Shop</span></a></div>
            <ul class="nav-links">
                <li><a href="/index.html"><i class="fa-solid fa-house"></i> หน้าแรก</a></li>
                <li><a href="/pages/wallet.html"><i class="fa-solid fa-coins"></i> เติมเงิน</a></li>
                <li><a href="/pages/gamepass.html"><i class="fa-solid fa-store"></i> สินค้าและบริการต่างๆ</a></li>
                <li><a href="javascript:void(0)" onclick="openContactPopup()"><i class="fa-solid fa-headset"></i>
                        ติดต่อเรา</a></li>
            </ul>
            <div class="mobile-menu-toggle"><i class="fa-solid fa-bars"></i></div>
            <div class="auth-buttons"></div>
        </div>
    </nav>
    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <div class="container">
            <ul class="breadcrumb-list">
                <li><a href="/index.html"><i class="fa-solid fa-house"></i> หน้าแรก</a></li>
                <li><span class="breadcrumb-separator"><i class="fa-solid fa-chevron-right"></i></span></li>
                <li><a href="/pages/gamepass.html"><i class="fa-solid fa-folder"></i> หมวดหมู่ทั้งหมด</a></li>
                <li><span class="breadcrumb-separator"><i class="fa-solid fa-chevron-right"></i></span></li>
                <li class="active"><span id="breadcrumbCurrent">สินค้า</span></li>
            </ul>
        </div>
    </div>

    <!-- Header Banner - Dynamic -->
    <div class="page-header game-header" id="pageHeader" style="background: linear-gradient(135deg, #0288d1, #4fc3f7);">
        <div class="container">
            <h1 id="pageTitle"><i class="fa-solid fa-spinner fa-spin"></i> กำลังโหลด...</h1>
            <p id="pageDesc">สินค้าทั้งหมด</p>
        </div>
    </div>

    <section class="products-section">
        <div class="container">
            <!-- Filter Bar -->
            <div class="filter-bar">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 ค้นหาสินค้า...">
                <select class="sort-select" id="sortSelect">
                    <option value="default">เรียงค่าเริ่มต้น</option>
                    <option value="price-asc">ราคา: ต่ำ → สูง</option>
                    <option value="price-desc">ราคา: สูง → ต่ำ</option>
                    <option value="name-asc">ชื่อ: ก → ฮ</option>
                    <option value="popular">ขายดี</option>
                </select>
                <span class="product-count" id="productCount"></span>
            </div>

            <!-- Products Grid - Dynamic -->
            <div class="pd-grid" id="productsGrid">
                <div class="products-loading" style="grid-column:1/-1;">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    <p>กำลังโหลดสินค้า...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Contact Popup -->
    <div class="contact-popup-overlay" id="contactPopup" onclick="closeContactPopup()">
        <div class="contact-popup" onclick="event.stopPropagation()">
            <div class="contact-popup-header">
                <h3><i class="fa-solid fa-headset"></i> ติดต่อเรา</h3>
                <button class="contact-close-btn" onclick="closeContactPopup()"><i
                        class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="contact-popup-body">
                <a href="https://www.facebook.com/chnuth.phrhm.k.w.phrhm.k.w?locale=th_TH" target="_blank"
                    class="contact-item">
                    <div class="contact-icon facebook"><i class="fa-brands fa-facebook-f"></i></div>
                    <div class="contact-info">
                        <h4>Facebook</h4>
                        <p>ส่งข้อความผ่าน Facebook</p>
                    </div>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
                <a href="https://discord.gg/mCegxu4R" target="_blank" class="contact-item">
                    <div class="contact-icon discord"><i class="fa-brands fa-discord"></i></div>
                    <div class="contact-info">
                        <h4>Discord</h4>
                        <p>เข้าร่วม Discord Server</p>
                    </div>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        function openContactPopup() { document.getElementById('contactPopup').classList.add('active'); }
        function closeContactPopup() { document.getElementById('contactPopup').classList.remove('active'); }

        let allProducts = [];
        let categorySlug = null;
        let categoryInfo = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            categorySlug = params.get('cat') || params.get('category');
            await loadProducts();
            document.getElementById('searchInput').addEventListener('input', renderFilteredProducts);
            document.getElementById('sortSelect').addEventListener('change', renderFilteredProducts);

            // Load banner popup
            try {
                const bannerResult = await KNShop.getBanners();
                if (bannerResult.success && bannerResult.banners && bannerResult.banners.length > 0) {
                    initHomeBannerPopup(bannerResult.banners);
                }
            } catch (e) { console.error('Banner error:', e); }
        });

        async function loadProducts() {
            try {
                if (categorySlug) {
                    const [catData, prodData] = await Promise.all([
                        KNShop.getCategory(categorySlug),
                        KNShop.getProducts(categorySlug)
                    ]);
                    if (catData.success && catData.category) {
                        categoryInfo = catData.category;
                        // Use image as header if available, otherwise use name
                        if (categoryInfo.image) {
                            document.getElementById('pageTitle').innerHTML = categoryInfo.name;
                            document.getElementById('pageHeader').style.background = `linear-gradient(135deg, #0277bd, #4fc3f7)`;
                        } else {
                            document.getElementById('pageTitle').innerHTML = categoryInfo.name;
                        }
                        document.getElementById('pageDesc').textContent = categoryInfo.description || 'สินค้าทั้งหมดในหมวดนี้';
                        document.title = `สินค้า ${categoryInfo.name} - KN Shop`;
                        // Update breadcrumb
                        const bcEl = document.getElementById('breadcrumbCurrent');
                        if (bcEl) bcEl.textContent = categoryInfo.name;
                    }
                    allProducts = (prodData.success && prodData.products) ? prodData.products : [];
                } else {
                    const data = await KNShop.getProducts();
                    allProducts = (data.success && data.products) ? data.products : [];
                    document.getElementById('pageTitle').innerHTML = '<i class="fa-solid fa-store"></i> สินค้าทั้งหมด';
                    document.getElementById('pageDesc').textContent = 'ไอเทมเกมทุกชนิด ราคาถูก ส่งไว';
                    document.title = 'สินค้าทั้งหมด - KN Shop';
                    const bcEl = document.getElementById('breadcrumbCurrent');
                    if (bcEl) bcEl.textContent = 'สินค้าทั้งหมด';
                }
                renderFilteredProducts();
            } catch (err) {
                console.error('Load products error:', err);
                document.getElementById('productsGrid').innerHTML = '<div class="products-empty" style="grid-column:1/-1;"><i class="fa-solid fa-exclamation-triangle"></i><p>ไม่สามารถโหลดสินค้าได้</p></div>';
            }
        }

        function renderFilteredProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const sortBy = document.getElementById('sortSelect').value;

            let filtered = allProducts.filter(p => {
                if (!p.isActive) return false;
                if (searchTerm && !p.title.toLowerCase().includes(searchTerm)) return false;
                return true;
            });

            switch (sortBy) {
                case 'price-asc': filtered.sort((a, b) => a.price - b.price); break;
                case 'price-desc': filtered.sort((a, b) => b.price - a.price); break;
                case 'name-asc': filtered.sort((a, b) => a.title.localeCompare(b.title)); break;
                case 'popular': filtered.sort((a, b) => (b.soldCount || 0) - (a.soldCount || 0)); break;
            }

            document.getElementById('productCount').textContent = `แสดง ${filtered.length} จาก ${allProducts.length} รายการ`;

            const grid = document.getElementById('productsGrid');
            if (filtered.length === 0) {
                grid.innerHTML = `<div class="products-empty" style="grid-column:1/-1;">
                    <i class="fa-solid fa-box-open"></i>
                    <h3>ไม่พบสินค้า</h3>
                    <p style="color:#999; margin-top:5px;">${searchTerm ? 'ลองค้นหาด้วยคำอื่น' : 'ยังไม่มีสินค้าในหมวดนี้'}</p>
                </div>`;
                return;
            }

            grid.innerHTML = filtered.map(p => {
                // Image section
                const imgHtml = p.image
                    ? `<img src="${p.image}" alt="${p.title}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                       <div class="pd-card-label" style="display:none;">${p.imgLabel || p.title}</div>`
                    : `<div class="pd-card-label">${p.imgLabel || p.title}</div>`;

                // Determine if out of stock (inStock=false OR stockQty=0)
                const isOutOfStock = !p.inStock || p.stockQty === 0;

                // Stock info
                let stockText = '';
                let stockClass = 'stock-info';
                if (isOutOfStock) {
                    stockText = 'สินค้าหมด';
                    stockClass = 'stock-info out-of-stock';
                } else if (p.stockQty === -1 || p.stockQty === undefined) {
                    stockText = 'สินค้าไม่จำกัด';
                } else {
                    stockText = `เหลือ ${p.stockQty.toLocaleString()} ชิ้น`;
                }

                // Sold count
                const soldCount = p.soldCount || 0;

                return `<div class="pd-card">
                    ${isOutOfStock ? '<div class="pd-out-badge">สินค้าหมด</div>' : ''}
                    ${p.isHot && !isOutOfStock ? '<div class="pd-hot-badge"><i class="fa-solid fa-fire"></i> HOT</div>' : ''}
                    <div class="pd-card-image">
                        ${imgHtml}
                    </div>
                    <div class="pd-body">
                        <div class="pd-title">${p.title}</div>
                        ${p.description ? `<div class="pd-desc">${p.description}</div>` : ''}
                        <div class="pd-price">${p.price.toLocaleString()} P</div>
                        <div class="pd-meta">
                            <span class="sold-info"><i class="fa-solid fa-bag-shopping"></i> ขายแล้ว ${soldCount.toLocaleString()} ชิ้น</span>
                            <span class="${stockClass}"><i class="fa-solid fa-warehouse"></i> ${stockText}</span>
                        </div>
                        <a href="/pages/product-detail.html?id=${p._id}" class="pd-btn ${isOutOfStock ? 'disabled' : ''}">
                            <i class="fa-solid fa-cart-shopping"></i> ${isOutOfStock ? 'สินค้าหมด' : 'ซื้อสินค้า'}
                        </a>
                    </div>
                </div>`;
            }).join('');
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeContactPopup();
        });
    </script>
    <script src="/js/script.js"></script>
</body>

</html>
